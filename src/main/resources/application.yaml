spring:
  application:
    name: vendia

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vendia}
    username: ${DB_USER:vendia}
    password: ${DB_PASSWORD:vendia}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # le schéma est piloté par Flyway, jamais par Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

vendia:
  jwt:
    secret: ${JWT_SECRET:changez-cette-valeur-en-production-avec-une-cle-longue-et-aleatoire}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000} # 7 jours
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}

logging:
  level:
    com.vendia.backend: DEBUG
    org.hibernate.SQL: DEBUG