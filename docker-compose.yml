services:
  postgres:
    image: postgres:16-alpine
    container_name: vendia-postgres
    environment:
      POSTGRES_DB: vendia
      POSTGRES_USER: vendia
      POSTGRES_PASSWORD: vendia
    ports:
      - "5434:5432"
    volumes:
      - vendia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendia"]
      interval: 5s
      timeout: 5s
      retries: 5
  
volumes:
  vendia_pgdata: